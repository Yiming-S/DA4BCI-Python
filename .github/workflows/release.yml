name: Publish to PyPI

# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed, using PyPI
# Trusted Publishing (OIDC) — no API token is stored in the repo.
#
# One-time setup on PyPI: project Settings -> Publishing -> add a trusted
# publisher for this repo with workflow "release.yml" and environment "pypi".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
