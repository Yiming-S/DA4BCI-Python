[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "da4bci"
version = "0.1.1"
description = "A Unified Framework for Domain Adaptation in EEG-based BCI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Yiming Shen", email = "yiming.shen001@umb.edu" },
    { name = "David Degras", email = "david.degras@umb.edu" },
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/da4bci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
